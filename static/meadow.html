<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Meadow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<script>
  window.onerror = function (msg, src, line, col) {
    try {
      var x = new XMLHttpRequest(); x.open('POST', '/api/clientlog', true);
      x.send(msg + ' @ ' + (src || '').split('/').pop() + ':' + line + ':' + (col || 0) + ' | ' + navigator.userAgent);
    } catch (e) {}
  };
  try { var sc = localStorage.getItem('scene'); if (sc === 'photos') location.replace('/' + location.search); else if (sc === 'city') location.replace('/city.html' + location.search); } catch (e) {}
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /*
   * "The painter's meadow": a storybook field drawn in code. The words sit in the sky
   * like a picture-book caption; the wind reading sits down in the grass it moves.
   * Ink: day #1d3350, golden #3b2417, night #f3ead6; ground text #f7f0dc.
   * Type: Newsreader only. iOS 9 Safari: no CSS variables, no grid, prefixed flexbox.
   */
  html, body { margin: 0; height: 100%; background: #0c1a14; overflow: hidden;
    font-family: 'Newsreader', Georgia, serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #stage { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; overflow: hidden;
    -webkit-transform-origin: 0 0; transform-origin: 0 0; -webkit-transition: opacity 2s; transition: opacity 2s; }
  #stage canvas, #clouds, #waves { position: absolute; left: 0; top: 0; }
  #clouds, #waves { width: 1024px; height: 768px; overflow: hidden; pointer-events: none; }
  #figure { position: absolute; left: 0; top: 0; }
  #grass { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; overflow: hidden; pointer-events: none; }
  #wx { pointer-events: none; }
  .wave { position: absolute; left: 0; top: 0; width: 460px; height: 70px;
    background: -webkit-radial-gradient(center, ellipse, rgba(255,255,215,0.16), rgba(255,255,215,0) 70%);
    background: radial-gradient(ellipse at center, rgba(255,255,215,0.16), rgba(255,255,215,0) 70%); }
  .flex { display: -webkit-flex; display: flex; }
  .tap { cursor: pointer; }
  .tap:active { opacity: 0.6; }

  /* sky text: ink changes with the light */
  #info { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; pointer-events: none;
    -webkit-transition: -webkit-transform 2s; transition: transform 2s; }
  #info .tap { pointer-events: auto; }
  .sky { color: #1d3350; text-shadow: 0 0 16px rgba(255,255,255,0.55), 0 0 3px rgba(255,255,255,0.4); }
  body.ph-golden .sky { color: #3b2417; text-shadow: 0 0 16px rgba(255,236,205,0.6), 0 0 3px rgba(255,236,205,0.4); }
  body.ph-night .sky { color: #f3ead6; text-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 18px rgba(0,0,20,0.6); }
  .ground { color: #f7f0dc; text-shadow: 0 1px 2px rgba(5,20,8,0.75), 0 0 16px rgba(5,20,8,0.6); }

  #clock { position: absolute; left: 50px; top: 26px; }
  #time { font-size: 150px; line-height: 1; letter-spacing: -4px; }
  #ampm { font-size: 40px; font-style: italic; margin-left: 10px; }
  #date { font-size: 28px; font-style: italic; margin-top: 2px; margin-left: 6px; }
  #msg { display: none; font-size: 24px; margin: 14px 0 0 6px; max-width: 380px; line-height: 1.3; }
  #msg:before { content: ''; display: inline-block; width: 26px; height: 2px; background: currentColor; vertical-align: middle; margin-right: 10px; opacity: 0.7; }

  #nav { position: absolute; right: 36px; top: 24px; -webkit-align-items: center; align-items: center; }
  #nav .link { font-size: 18px; padding: 8px 16px; margin-left: 10px; border: 1px solid rgba(29,51,80,0.35); border-radius: 20px; }
  body.ph-golden #nav .link { border-color: rgba(59,36,23,0.35); }
  body.ph-night #nav .link { border-color: rgba(243,234,214,0.35); }
  #units { font-size: 22px; padding: 6px 2px 6px 12px; }
  #units span { display: inline-block; padding: 2px 6px; opacity: 0.5; }
  #units span.on { opacity: 1; border-bottom: 2px solid currentColor; }

  #weather { position: absolute; right: 44px; top: 78px; width: 380px; text-align: right; }
  #w-temp { font-size: 92px; line-height: 0.95; letter-spacing: -3px; }
  #w-text { font-size: 21px; line-height: 1.3; margin-top: 6px; }
  #w-sun { font-size: 18px; font-style: italic; margin-top: 4px; opacity: 0.85; }
  #w-days { margin-top: 10px; -webkit-justify-content: flex-end; justify-content: flex-end; }
  .day { margin-left: 22px; text-align: center; font-size: 19px; line-height: 1.25; }
  .day i { display: block; font-size: 17px; opacity: 0.85; }
  .day .lo { opacity: 0.6; }
  .day small { display: block; font-size: 14px; font-style: italic; opacity: 0.8; }

  /* wind reading, down in the grass it moves */
  #wind { position: absolute; left: 92px; top: 552px; }
  #wind-speed { font-size: 64px; line-height: 1; letter-spacing: -1px; }
  #wind-speed small { font-size: 26px; letter-spacing: 0; margin-left: 6px; font-style: italic; }
  #wind-words { font-size: 22px; font-style: italic; margin-top: 4px; max-width: 280px; line-height: 1.25; }

  #sys { position: absolute; right: 30px; bottom: 22px; font-size: 18px; padding: 8px 6px; }
  #sys span { margin-left: 18px; }
  #sys b { font-weight: 500; }
  #status { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 16px; }

  #painting-hit { position: absolute; left: 562px; top: 318px; width: 200px; height: 150px; }
  #viewer { display: none; position: absolute; left: 0; top: 0; width: 1024px; height: 768px; background: rgba(10,14,12,0.86); pointer-events: auto; }
  #viewer.on { display: block; }
  #viewer div { position: absolute; left: 92px; top: 64px; width: 840px; height: 630px; background-size: cover; background-position: center;
    box-shadow: 0 0 0 12px #8b6142, 0 0 0 14px #5f4129, 0 20px 60px rgba(0,0,0,0.6); }
  #viewer p { position: absolute; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center; color: #f7f0dc; font-style: italic; font-size: 18px; opacity: 0.8; }

  body.night #stage { opacity: 0.45; }
</style>
</head>
<body class="ph-day">
<div id="stage">
  <canvas id="backdrop"></canvas>
  <canvas id="moon"></canvas>
  <canvas id="sun"></canvas>
  <canvas id="land"></canvas>
  <div id="clouds"></div>
  <div id="waves"></div>
  <div id="figure"></div>
  <canvas id="wx"></canvas>
  <div id="grass"></div>
  <div id="info">
    <div id="clock" class="sky">
      <div><span id="time">--:--</span><span id="ampm"></span></div>
      <div id="date"></div>
      <div id="msg"></div>
    </div>
    <div id="nav" class="flex sky">
      <div class="link tap" id="go-photos">Photo scene</div>
      <div class="link tap" id="go-city">City scene</div>
      <div class="link tap" id="go-home">Home controls</div>
      <div id="units" class="tap"><span data-u="F">°F</span><span data-u="C">°C</span></div>
    </div>
    <div id="weather" class="sky">
      <div id="w-temp"></div>
      <div id="w-text"></div>
      <div id="w-sun"></div>
      <div id="w-days" class="flex"></div>
    </div>
    <div id="wind" class="ground">
      <div id="wind-speed"></div>
      <div id="wind-words"></div>
    </div>
    <div id="sys" class="ground tap"></div>
    <div id="status" class="ground"></div>
    <div id="painting-hit" class="tap"></div>
    <div id="viewer" class="tap"><div id="viewer-img"></div><p>Tap anywhere to go back to the meadow</p></div>
  </div>
</div>
<script src="sky.js"></script>
<script src="meadow.js"></script>
<script>
(function () {
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var DSHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var COMPASS = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'];
  var night = [23, 7], lastOk = 0, lastState = null, build = null;
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function setBodyClass(name, on) {
    var c = (' ' + document.body.className + ' ').replace(' ' + name + ' ', ' ');
    if (on) c += ' ' + name;
    document.body.className = c.replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ');
  }
  function onTap(el, fn) { el.addEventListener('click', fn, false); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var unit = store('unit') || null;
  function T(c) { return c == null ? '--' : Math.round(unit === 'F' ? c * 9 / 5 + 32 : c); }
  function paintUnits() {
    var s = $('units').getElementsByTagName('span');
    for (var i = 0; i < s.length; i++) s[i].className = s[i].getAttribute('data-u') === unit ? 'on' : '';
  }
  onTap($('units'), function () { unit = unit === 'F' ? 'C' : 'F'; store('unit', unit); paintUnits(); if (lastState) render(lastState); });
  onTap($('go-photos'), function () { store('scene', 'photos'); location.href = '/'; });
  onTap($('go-city'), function () { store('scene', 'city'); location.href = '/city.html'; });
  onTap($('go-home'), function () { location.href = '/#home'; });
  onTap($('sys'), function () { location.href = '/#system'; });
  onTap($('painting-hit'), function () {
    var src = Meadow.photo();
    $('viewer-img').style.backgroundImage = 'url(' + (src || Meadow.snapshot()) + ')';
    $('viewer').className = 'on tap';
    clearTimeout(onTap.v); onTap.v = setTimeout(function () { $('viewer').className = 'tap'; }, 30000);
  });
  onTap($('viewer'), function () { $('viewer').className = 'tap'; });

  function tick() {
    var d = new Date(), h = d.getHours();
    $('time').textContent = (h % 12 || 12) + ':' + pad(d.getMinutes());
    $('ampm').textContent = h < 12 ? 'am' : 'pm';
    $('date').textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
    var isNight = night[0] > night[1] ? (h >= night[0] || h < night[1]) : (h >= night[0] && h < night[1]);
    setBodyClass('night', isNight);
    Meadow.dim(isNight);
    $('status').textContent = lastOk && Date.now() - lastOk > 30000 ? 'Lost connection to the panel server' : '';
  }

  function clock12(iso) { var p = iso.split('T')[1].split(':'), h = +p[0]; return (h % 12 || 12) + ':' + p[1] + (h < 12 ? ' am' : ' pm'); }
  function windWords(kmh, dir) {
    var from = dir == null ? '' : ' from the ' + COMPASS[Math.round(dir / 45) % 8];
    if (kmh < 2) return 'Still air. The grass is resting.';
    var kind = kmh < 12 ? 'A light breeze' : kmh < 29 ? 'A steady breeze' : kmh < 39 ? 'A fresh wind'
      : kmh < 50 ? 'A strong wind' : kmh < 62 ? 'Near-gale winds' : 'Gale-force winds';
    return kind + from + '.';
  }
  function renderWeather(w) {
    Meadow.setWeather(w);
    var ph = Meadow.phase();
    setBodyClass('ph-day', ph === 'day'); setBodyClass('ph-golden', ph === 'golden'); setBodyClass('ph-night', ph === 'night');
    if (!w || w.error) {
      $('w-temp').textContent = ''; $('w-text').textContent = 'Weather is unavailable right now.';
      $('w-sun').textContent = ''; $('w-days').innerHTML = ''; return;
    }
    $('w-temp').textContent = T(w.temp) + '°';
    var feels = Math.abs(T(w.feels) - T(w.temp)) >= 3;
    $('w-text').innerHTML = esc(w.desc) + ' in ' + esc(w.place || 'town') + '.<br>' +
      (feels ? 'Feels like ' + T(w.feels) + '°, humidity ' : 'Humidity ') + esc(w.humidity) + '%.';
    var d = new Date(Date.now() + (w.utc_offset || 0) * 1000), hm = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    var setHm = w.sunset.split('T')[1], riseHm = w.sunrise.split('T')[1];
    $('w-sun').textContent = hm < riseHm ? 'Sunrise at ' + clock12(w.sunrise) : hm < setHm ? 'Sunset at ' + clock12(w.sunset) : 'Sunrise at ' + clock12(w.sunrise);
    var html = '';
    for (var i = 0; i < w.days.length; i++) {
      var dd = w.days[i], p = dd.date.split('-');
      var name = i === 0 ? 'Today' : DSHORT[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
      html += '<div class="day"><i>' + name + '</i>' + T(dd.hi) + '° <span class="lo">' + T(dd.lo) + '°</span>' +
        '<small>' + (dd.rain >= 30 ? esc(dd.rain) + '% rain' : '&nbsp;') + '</small></div>';
    }
    $('w-days').innerHTML = html;
    var kmh = Meadow.wind();
    $('wind-speed').innerHTML = kmh < 2 ? 'Calm' : (unit === 'F' ? Math.round(kmh * 0.621) + '<small>mph</small>' : Math.round(kmh) + '<small>km/h</small>');
    $('wind-words').textContent = windWords(kmh, w.wind_dir);
  }
  function renderSys(s) {
    var sys = s.system, home = sys.disks && sys.disks[0];
    $('sys').innerHTML = '<b>' + esc(s.host) + '</b><span>CPU ' + Math.round(sys.cpu || 0) + '%</span><span>Memory ' + Math.round(sys.mem.percent) + '%</span>' +
      (home ? '<span>' + esc(home.label) + ' disk ' + Math.round(home.percent) + '%</span>' : '');
  }

  function render(s) {
    if (build && s.build && s.build !== build) { location.reload(); return; }
    build = s.build || build;
    if (!store('scene') && s.default_scene === 'photos') { location.replace('/'); return; }
    if (!store('scene') && s.default_scene === 'city') { location.replace('/city.html'); return; }
    lastState = s; night = s.night || night;
    if (!unit) { unit = s.default_unit || 'F'; paintUnits(); }
    renderWeather(s.weather);
    renderSys(s);
    var m = $('msg');
    if (s.message && s.message.text) { m.textContent = s.message.text; m.style.display = 'block'; } else m.style.display = 'none';
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/state?v=2&t=' + Date.now(), true);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status === 200) { try { render(JSON.parse(x.responseText)); lastOk = Date.now(); } catch (e) { window.onerror(String(e), 'meadow.html', 0, 0); } }
    };
    x.send();
  }
  var shift = 0;   // move the words a few pixels every 5 min against LCD image retention
  setInterval(function () {
    shift = (shift + 1) % 4;
    var t = 'translate(' + [0, 4, 4, 0][shift] + 'px,' + [0, 0, -4, -4][shift] + 'px)';
    $('info').style.webkitTransform = t; $('info').style.transform = t;
  }, 300000);

  if (unit) paintUnits();
  tick(); poll();
  setInterval(tick, 1000);
  setInterval(poll, 5000);
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
  try { var x = new XMLHttpRequest(); x.open('POST', '/api/clientlog', true); x.send('status: meadow scene loaded, screen ' + screen.width + 'x' + screen.height); } catch (e) {}
})();
</script>
</body>
</html>
