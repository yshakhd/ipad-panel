<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>City</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<script>
  window.onerror = function (msg, src, line, col) {
    try {
      var x = new XMLHttpRequest(); x.open('POST', '/api/clientlog', true);
      x.send(msg + ' @ ' + (src || '').split('/').pop() + ':' + line + ':' + (col || 0) + ' | ' + navigator.userAgent);
    } catch (e) {}
  };
  try { var sc = localStorage.getItem('scene'); if (sc === 'photos') location.replace('/' + location.search); else if (sc === 'meadow') location.replace('/meadow.html' + location.search); } catch (e) {}
  // Watchdog: if this page stops polling (a script that failed to load or parse kills the
  // page's own code, and with it the reload that would bring the fix), reload once the
  // server answers again. The page's poll sets window.LIVE each time it hears back.
  window.LIVE = Date.now();
  setInterval(function () {
    if (Date.now() - window.LIVE < 90000) return;
    var x = new XMLHttpRequest(); x.open('GET', '/api/state?ping=' + Date.now(), true);
    x.onload = function () { if (x.status === 200) location.reload(); };
    x.send();
  }, 30000);
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /*
   * "The city": a high corner apartment in Manhattan. The time and weather sit over the
   * picture as in the meadow; the time also glows on the clock on his desk and by the bed.
   * Sky ink: day #16202e, golden and night #fbf3e6. Clocks: amber #ff9a4a.
   * Type: Newsreader for the words, Big Shoulders Display for the clocks.
   * iOS 9 Safari: no CSS variables, no grid, prefixed flexbox.
   */
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: 'Newsreader', Georgia, serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #stage { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; overflow: hidden;
    -webkit-transform-origin: 0 0; transform-origin: 0 0; -webkit-transition: opacity 2s; transition: opacity 2s; }
  #world { position: absolute; left: 0; top: 0; width: 2048px; height: 768px; }
  .half { position: absolute; top: 0; width: 1024px; height: 768px; overflow: hidden; }
  .half > div { position: absolute; left: 0; top: 0; }
  #bed { left: 0; } #desk { left: 1024px; }
  .flex { display: -webkit-flex; display: flex; }
  .tap { cursor: pointer; }
  .tap:active { opacity: 0.6; }

  /* words over the picture, as in the meadow: ink follows the light */
  #info { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; pointer-events: none;
    -webkit-transition: -webkit-transform 2s; transition: transform 2s; }
  #info .tap { pointer-events: auto; }
  /* The words sit over towers, window frames and lit windows, so they always get cream ink
     and a soft shade behind them, darker at night, like dusk gathering in the room's corners. */
  .sky { color: #fbf3e6; text-shadow: 0 1px 2px rgba(0,0,0,0.65), 0 0 14px rgba(6,8,16,0.7); }
  .shade { position: absolute; pointer-events: none; }
  #shade-l { left: -60px; top: -70px; width: 660px; height: 440px;
    background: -webkit-radial-gradient(38% 46%, ellipse closest-side, rgba(8,10,18,0.5), rgba(8,10,18,0.32) 55%, rgba(8,10,18,0));
    background: radial-gradient(ellipse closest-side at 38% 46%, rgba(8,10,18,0.5), rgba(8,10,18,0.32) 55%, rgba(8,10,18,0)); }
  #shade-r { left: 500px; top: -40px; width: 620px; height: 380px;
    background: -webkit-radial-gradient(64% 46%, ellipse closest-side, rgba(8,10,18,0.5), rgba(8,10,18,0.32) 55%, rgba(8,10,18,0));
    background: radial-gradient(ellipse closest-side at 64% 46%, rgba(8,10,18,0.5), rgba(8,10,18,0.32) 55%, rgba(8,10,18,0)); }
  body.ph-day .shade { opacity: 0.85; }
  .ground { color: #f7f0e6; text-shadow: 0 1px 2px rgba(0,0,0,0.8), 0 0 14px rgba(0,0,0,0.6); }
  #clock { position: absolute; left: 50px; top: 26px; }
  #time { font-size: 150px; line-height: 1; letter-spacing: -4px; }
  #ampm { font-size: 40px; font-style: italic; margin-left: 10px; }
  #date { font-size: 28px; font-style: italic; margin-top: 2px; margin-left: 6px; }
  #msg { display: none; font-size: 24px; margin: 14px 0 0 6px; max-width: 380px; line-height: 1.3; }
  #msg:before { content: ''; display: inline-block; width: 26px; height: 2px; background: currentColor; vertical-align: middle; margin-right: 10px; opacity: 0.7; }
  #weather { position: absolute; right: 44px; top: 62px; width: 420px; text-align: right; }
  #w-temp { font-size: 80px; line-height: 0.95; letter-spacing: -3px; }
  #w-text { font-size: 21px; line-height: 1.3; margin-top: 4px; }
  #w-sun { font-size: 18px; font-style: italic; margin-top: 1px; opacity: 0.85; }
  #w-days { margin-top: 4px; -webkit-justify-content: flex-end; justify-content: flex-end; }
  .day { margin-left: 16px; font-size: 18px; line-height: 1.25; }
  .day i { font-size: 17px; opacity: 0.85; margin-right: 4px; }
  .day .lo { opacity: 0.75; }
  #wind { position: absolute; right: 44px; top: 630px; text-align: right; }
  #wind-speed { font-size: 56px; line-height: 1; }
  #wind-speed small { font-size: 24px; margin-left: 6px; font-style: italic; }
  #wind-words { font-size: 20px; font-style: italic; margin-top: 2px; }

  /* the digital clock on his desk */
  #dclock { left: 140px; top: 442px; width: 110px; height: 36px; text-align: center; color: #ff9a4a;
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 600; font-size: 30px; line-height: 36px; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,140,60,0.8); }
  #dclock small { font-size: 13px; margin-left: 3px; letter-spacing: 0; }

  /* the clock by the bed: dim amber, as bedside clocks are */
  #bc { left: 54px; top: 428px; width: 126px; height: 66px; text-align: center; color: #ffb36b; }
  #bc-time { font-size: 38px; font-weight: 600; line-height: 1; }
  #bc-time small { font-size: 14px; margin-left: 2px; }
  #bc-sun { font-size: 11px; color: #a8845e; }
  #phone { left: 66px; top: 494px; width: 60px; height: 30px; opacity: 0;
    background: -webkit-radial-gradient(center, ellipse, rgba(140,200,255,0.55), rgba(140,200,255,0) 70%);
    background: radial-gradient(ellipse at center, rgba(140,200,255,0.55), rgba(140,200,255,0) 70%);
    -webkit-transition: opacity 0.8s; transition: opacity 0.8s; }

  #photo-hit { left: 748px; top: 272px; width: 220px; height: 160px; }

  /* scene links, computer stats */
  #nav { position: absolute; right: 22px; top: 18px; -webkit-align-items: center; align-items: center; }
  #nav .link, #units { font-size: 15px; color: #e9eef5; padding: 6px 13px; margin-left: 8px; border-radius: 16px;
    background: rgba(8,10,18,0.5); }
  #units span { display: inline-block; padding: 0 4px; opacity: 0.5; }
  #units span.on { opacity: 1; }
  #sys { position: absolute; right: 24px; bottom: 16px; font-size: 16px; padding: 6px; color: #e7e3dc;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
  #sys span { margin-left: 16px; }
  #sys b { font-weight: 500; }
  #status { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 16px; color: #f7f0dc; text-shadow: 0 1px 2px #000; }
  #viewer { display: none; position: absolute; left: 0; top: 0; width: 1024px; height: 768px; background: rgba(6,8,12,0.9); }
  #viewer.on { display: block; }
  #viewer div { position: absolute; left: 92px; top: 64px; width: 840px; height: 630px; background-size: cover; background-position: center;
    box-shadow: 0 0 0 10px #101216, 0 20px 60px rgba(0,0,0,0.6); }
  #viewer p { position: absolute; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center; color: #e9eef5; font-style: italic; font-size: 18px; opacity: 0.8; }
  body.night #stage { opacity: 0.45; }
  #notes { margin: 10px 0 0 6px; max-width: 420px; font-size: 21px; line-height: 1.35; }
  #notes div:before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin: 0 10px 2px 2px; background: currentColor; opacity: 0.55; vertical-align: middle; }
  #notes .n-alert:before { background: #ff7a45; opacity: 1; }
  #notes .n-ev:before { background: #ffc24a; opacity: 1; }
  #w-more { font-size: 18px; font-style: italic; margin-top: 2px; line-height: 1.3; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="bed" class="half">
      <div></div>
      <div id="bc" class="disp"><div id="bc-time">--:--</div><div id="bc-sun"></div></div>
      <div id="phone"></div>
    </div>
    <div id="desk" class="half">
      <div></div>
      <div id="dclock">--:--</div>
      <div id="photo-hit" class="tap"></div>
    </div>
  </div>
  <div id="info">
    <div class="shade" id="shade-l"></div><div class="shade" id="shade-r"></div>
    <div id="clock" class="sky">
      <div><span id="time">--:--</span><span id="ampm"></span></div>
      <div id="date"></div>
      <div id="msg"></div>
      <div id="notes"></div>
    </div>
    <div id="weather" class="sky">
      <div id="w-temp"></div>
      <div id="w-text"></div>
      <div id="w-sun"></div>
      <div id="w-more"></div>
      <div id="w-days" class="flex"></div>
    </div>
    <div id="wind" class="ground">
      <div id="wind-speed"></div>
      <div id="wind-words"></div>
    </div>
  </div>
  <div id="nav" class="flex">
    <div class="link tap" id="go-home">Home controls</div>
    <div id="units" class="tap"><span data-u="F">°F</span><span data-u="C">°C</span></div>
  </div>
  <div id="sys" class="tap"></div>
  <div id="status"></div>
  <div id="viewer" class="tap"><div id="viewer-img"></div><p>Tap anywhere to go back to the city</p></div>
</div>
<script src="swipe.js"></script>
<link rel="x-later" href="wx.js">
<script src="sky.js"></script>
<script src="extras.js"></script>
<script src="city.js"></script>
<script>
(function () {
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var DSHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var COMPASS = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'];
  var night = [23, 7], lastOk = 0, lastState = null, build = null;
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function setBodyClass(name, on) {
    var c = (' ' + document.body.className + ' ').replace(' ' + name + ' ', ' ');
    if (on) c += ' ' + name;
    document.body.className = c.replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ');
  }
  function onTap(el, fn) { el.addEventListener('click', fn, false); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var unit = store('unit') || null;
  function T(c) { return c == null ? '--' : Math.round(unit === 'F' ? c * 9 / 5 + 32 : c); }
  function paintUnits() {
    var s = $('units').getElementsByTagName('span');
    for (var i = 0; i < s.length; i++) s[i].className = s[i].getAttribute('data-u') === unit ? 'on' : '';
  }
  onTap($('units'), function () { unit = unit === 'F' ? 'C' : 'F'; store('unit', unit); paintUnits(); if (lastState) render(lastState); });
  onTap($('go-home'), function () { location.href = '/#home'; });
  onTap($('sys'), function () { location.href = '/#system'; });
  onTap($('photo-hit'), function () {
    var src = City.photo();
    $('viewer-img').style.backgroundImage = 'url(' + (src || City.snapshot()) + ')';
    $('viewer').className = 'on tap';
    clearTimeout(onTap.v); onTap.v = setTimeout(function () { $('viewer').className = 'tap'; }, 30000);
  });
  onTap($('viewer'), function () { $('viewer').className = 'tap'; });
  // taps on the scene itself: wake the cat, call the dog (cursor:pointer so iOS 9 sends them)
  $('world').style.cursor = 'pointer';
  onTap($('world'), function (e) {
    if ((' ' + e.target.className + ' ').indexOf(' tap ') >= 0) return;
    var r = $('stage').getBoundingClientRect(), k = r.width / 1024;
    City.tap((e.clientX - r.left) / k, (e.clientY - r.top) / k);
  });

  function clock12(iso) { var p = iso.split('T')[1].split(':'), h = +p[0]; return (h % 12 || 12) + ':' + p[1] + (h < 12 ? ' am' : ' pm'); }
  function windWords(kmh, dir) {
    var from = dir == null ? '' : ' from the ' + COMPASS[Math.round(dir / 45) % 8];
    if (kmh < 2) return 'Still air over the city.';
    var kind = kmh < 12 ? 'A light breeze' : kmh < 29 ? 'A steady breeze' : kmh < 39 ? 'A fresh wind' : kmh < 50 ? 'A strong wind' : kmh < 62 ? 'Near-gale winds' : 'Gale-force winds';
    return kind + from + '.';
  }
  function tick() {
    var d = new Date(City.now()), h = d.getHours(), t = (h % 12 || 12) + ':' + pad(d.getMinutes()), ap = h < 12 ? 'am' : 'pm';
    $('time').textContent = t; $('ampm').textContent = ap;
    $('date').textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
    $('dclock').innerHTML = t + '<small>' + ap + '</small>';
    $('bc-time').innerHTML = t + '<small>' + ap + '</small>';
    var ph = City.phase();
    setBodyClass('ph-day', ph === 'day'); setBodyClass('ph-golden', ph === 'golden'); setBodyClass('ph-night', ph === 'night');
    var real = new Date().getHours();
    var isNight = night[0] > night[1] ? (real >= night[0] || real < night[1]) : (real >= night[0] && real < night[1]);
    isNight = isNight || Extras.away();   // dim when nobody's home too
    setBodyClass('night', isNight);
    City.dim(isNight);
    $('status').textContent = lastOk && Date.now() - lastOk > 30000 ? 'Lost connection to the panel server' : '';
  }
  setInterval(function () {   // a message lights up his phone now and then
    if (City.view() !== 'bed' || Math.random() > 0.25) return;
    $('phone').style.opacity = 1; setTimeout(function () { $('phone').style.opacity = 0; }, 4000);
  }, 20000);

  function renderWeather(w) {
    City.setWeather(w);
    if (!w || w.error) {
      $('w-temp').textContent = ''; $('w-text').textContent = 'Weather is unavailable right now.';
      $('w-sun').textContent = ''; $('w-days').innerHTML = ''; return;
    }
    $('w-temp').textContent = T(w.temp) + '°';
    var feels = Math.abs(T(w.feels) - T(w.temp)) >= 3;
    $('w-text').textContent = w.desc + ' in ' + (w.place || 'town') + (feels ? ', feels like ' + T(w.feels) + '°.' : '.');
    var d = new Date(City.now() + (w.utc_offset || 0) * 1000), hm = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    var setHm = w.sunset.split('T')[1], riseHm = w.sunrise.split('T')[1], riseNext = hm < riseHm || hm >= setHm;
    $('w-sun').textContent = riseNext ? 'Sunrise at ' + clock12(w.sunrise) : 'Sunset at ' + clock12(w.sunset);
    $('bc-sun').textContent = riseNext ? 'Sunrise ' + clock12(w.sunrise) : 'Sunset ' + clock12(w.sunset);
    var html = '';
    for (var i = 1; i < Math.min(4, w.days.length); i++) {
      var dd = w.days[i], p = dd.date.split('-');
      var name = i === 0 ? 'Today' : DSHORT[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
      html += '<div class="day"><i>' + name + '</i>' + T(dd.hi) + '° <span class="lo">' + T(dd.lo) + '°</span></div>';
    }
    $('w-days').innerHTML = html;
    var kmh = City.wind();
    $('wind-speed').innerHTML = kmh < 2 ? 'Calm' : (unit === 'F' ? Math.round(kmh * 0.621) + '<small>mph</small>' : Math.round(kmh) + '<small>km/h</small>');
    $('wind-words').textContent = windWords(kmh, w.wind_dir);
  }
  function renderSys(s) {
    var sys = s.system, home = sys.disks && sys.disks[0];
    $('sys').innerHTML = '<b>' + esc(s.host) + '</b><span>CPU ' + Math.round(sys.cpu || 0) + '%</span><span>Memory ' + Math.round(sys.mem.percent) + '%</span>' +
      (home ? '<span>' + esc(home.label) + ' disk ' + Math.round(home.percent) + '%</span>' : '');
  }
  function render(s) {
    if (build && s.build && s.build !== build) { location.reload(); return; }
    build = s.build || build;
    if (!store('scene') && !location.search && s.default_scene === 'photos') { location.replace('/'); return; }   // preview links stay here
    if (!store('scene') && !location.search && s.default_scene === 'meadow') { location.replace('/meadow.html'); return; }
    lastState = s; night = s.night || night;
    if (!unit) { unit = s.default_unit || 'F'; paintUnits(); }
    if (s.city) City.setHours(s.city.sleep_hour, s.city.wake_hour);
    renderWeather(s.weather);
    renderSys(s);
    City.setAir(s.air ? s.air.aqi : 0);
    Extras.render(s, { door: City.door, message: City.note });
    var m = $('msg');
    if (s.message && s.message.text) { m.textContent = s.message.text; m.style.display = 'block'; } else m.style.display = 'none';
    tick();
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/state?v=2&t=' + Date.now(), true);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status === 200) { try { render(JSON.parse(x.responseText)); lastOk = window.LIVE = Date.now(); Swipe.ready(); try { localStorage.setItem('state.cache', x.responseText); } catch (e2) {} } catch (e) { window.onerror(String(e), 'city.html', 0, 0); } }
    };
    x.send();
  }
  var shift = 0;   // move the words a few pixels every 5 min against LCD image retention
  setInterval(function () {
    shift = (shift + 1) % 4;
    var t = 'translate(' + [0, 4, 4, 0][shift] + 'px,' + [0, 0, -4, -4][shift] + 'px)';
    $('info').style.webkitTransform = t; $('info').style.transform = t;
  }, 300000);
  Swipe.lazyWx($('w-temp'), function () { return unit; });   // tap the temperature for the weather console
  Swipe.attach('city', function () { return $('viewer').className.indexOf('on') < 0; });   // swipe sideways for the next scene
  if (unit) paintUnits();
  // draw at once from the last state this iPad saw, rather than wait for the server's answer
  function fromCache() {
    try {
      var c = JSON.parse(localStorage.getItem('state.cache') || 'null');
      if (!c) return;
      c.events = []; c.server_time = Date.now() / 1000;
      render(c); build = null;   // the live answer decides whether the page files changed
      Swipe.mark('cached'); Swipe.ready();
    } catch (e) {}
  }
  fromCache(); poll();
  setInterval(tick, 1000);
  setInterval(poll, 5000);
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
  try { var x = new XMLHttpRequest(); x.open('POST', '/api/clientlog', true); x.send('status: city scene loaded, screen ' + screen.width + 'x' + screen.height); } catch (e) {}
})();
</script>
</body>
</html>
