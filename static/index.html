<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<script>
  // Report JS errors to the server journal: the iPad has no dev console.
  window.onerror = function (msg, src, line, col) {
    try {
      var x = new XMLHttpRequest(); x.open('POST', '/api/clientlog', true);
      x.send(msg + ' @ ' + (src || '').split('/').pop() + ':' + line + ':' + (col || 0) + ' | ' + navigator.userAgent);
    } catch (e) {}
  };
</script>
<script>
  // The meadow and the city are the other scenes; go to the one picked on this iPad (hash links like #home stay here).
  try { var sc = { meadow: '/meadow.html', city: '/city.html' }[localStorage.getItem('scene')]; if (sc && !location.hash) location.replace(sc + location.search); } catch (e) {}
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /*
   * "Caption on a photograph": the photo is the view, information is typeset
   * straight onto it. One loud element (the clock), everything else quiet.
   * Palette: paper #F2EDE4, mist #A9B3C1, amber #F5B04A, frost #79C2FF,
   * ember #FF8340, alarm #FF5D4E, night scrim rgb(6,10,22).
   * Type: Big Shoulders Display for numbers, Newsreader for words.
   * Must render on iOS 9 Safari: no CSS variables, no grid, prefixed flexbox.
   */
  html, body { margin: 0; height: 100%; background: #060a16; color: #F2EDE4; overflow: hidden;
    font-family: 'Newsreader', Georgia, serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  .num { font-family: 'Big Shoulders Display', 'Helvetica Neue', sans-serif; }
  .flex { display: -webkit-flex; display: flex; }
  .grow { -webkit-flex: 1; flex: 1; }
  .shadow { text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 2px 22px rgba(0,0,0,0.35); }
  .tap { cursor: pointer; }
  .tap:active { opacity: 0.6; }

  /* ---- background scene: sky gradient < photos < tint < scrims < weather canvas ---- */
  #bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden;
    -webkit-transition: opacity 2s; transition: opacity 2s; }
  #bg div, #wx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #sky { background: #0b1220; }
  #sky.sky-day { background: -webkit-linear-gradient(top, #2f6fb5, #8db8e0); background: linear-gradient(#2f6fb5, #8db8e0); }
  #sky.sky-golden { background: -webkit-linear-gradient(top, #3b3a6b, #d9845a); background: linear-gradient(#3b3a6b, #d9845a); }
  #sky.sky-night { background: -webkit-linear-gradient(top, #03050d, #16223d); background: linear-gradient(#03050d, #16223d); }
  .slide { background-size: cover; background-position: center; opacity: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  #tint { background: rgba(0,0,0,0.12); }
  #tint.golden { background: rgba(255,130,50,0.12); }
  #tint.night { background: rgba(4,10,40,0.42); }
  #tint.gray { background-color: rgba(80,92,110,0.3); }
  #tint.dark { background-color: rgba(10,15,25,0.45); }
  /* readable ground for the type: darker at top-left corner and along the bottom */
  #scrim { background: -webkit-linear-gradient(top, rgba(6,10,22,0.6), rgba(6,10,22,0) 28%, rgba(6,10,22,0.08) 36%, rgba(6,10,22,0.55) 58%, rgba(6,10,22,0.86) 90%);
    background: linear-gradient(rgba(6,10,22,0.6), rgba(6,10,22,0) 28%, rgba(6,10,22,0.08) 36%, rgba(6,10,22,0.55) 58%, rgba(6,10,22,0.86) 90%); }
  #wx { pointer-events: none; }
  body.night #bg { opacity: 0.4; }

  /* ---- overview ---- */
  #wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    -webkit-transition: opacity 2s, -webkit-transform 2s; transition: opacity 2s, transform 2s; }
  body.night #wrap, body.night #homeview, body.night #sheet { opacity: 0.55; }
  #top { position: absolute; top: 30px; left: 40px; right: 34px; -webkit-align-items: baseline; align-items: baseline; }
  #date { font-style: italic; font-size: 27px; }
  #nav { -webkit-align-items: center; align-items: center; }
  #nav .link { font-size: 19px; padding: 10px 18px; margin-right: 10px; color: #F2EDE4;
    border: 1px solid rgba(242,237,228,0.35); border-radius: 22px; }
  #units { font-size: 26px; letter-spacing: 1px; padding: 6px 4px; }
  #units span { display: inline-block; padding: 4px 8px; color: rgba(169,179,193,0.75); }
  #units span.on { color: #F2EDE4; border-bottom: 2px solid #F5B04A; }
  #lead { position: absolute; top: 86px; left: 40px; max-width: 640px; }
  #notes { margin-top: 10px; font-size: 22px; line-height: 1.35; color: #ece6dc; }
  #notes div:before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin: 0 10px 2px 2px; background: #A9B3C1; vertical-align: middle; }
  #notes .n-alert:before { background: #ff7a45; }
  #notes .n-ev:before { background: #F5B04A; }
  #w-more { margin-top: 10px; font-size: 17px; font-style: italic; line-height: 1.35; color: #d9d4ca; }
  #msg { display: none; font-size: 32px;
    line-height: 1.25; padding: 4px 0 4px 18px; border-left: 3px solid #F5B04A; }

  #clock { position: absolute; left: 28px; bottom: 100px; line-height: 0.78; }
  #time { font-weight: 200; font-size: 350px; letter-spacing: -4px; }
  #ampm { font-style: italic; font-size: 30px; margin-left: 10px; color: #d9d4ca; }

  #weather { position: absolute; right: 40px; bottom: 112px; width: 410px; }
  #arc { height: 72px; margin-bottom: 6px; } #arc svg { display: block; }
  #w-now { -webkit-align-items: flex-end; align-items: flex-end; }
  #w-temp { font-size: 104px; font-weight: 400; line-height: 0.82; margin-right: 16px; }
  #w-text { font-size: 20px; line-height: 1.38; color: #ece6dc; }
  #w-days { margin-top: 18px; }
  .day { -webkit-align-items: center; align-items: center; height: 31px; }
  .day .dn { width: 64px; font-style: italic; font-size: 18px; color: #d9d4ca; }
  .day .lo, .day .hi { width: 36px; font-size: 21px; }
  .day .lo { text-align: right; color: #A9B3C1; padding-right: 10px; }
  .day .hi { padding-left: 10px; }
  .day .track { position: relative; height: 5px; border-radius: 3px; background: rgba(242,237,228,0.14); }
  .day .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .day .rain { width: 76px; text-align: right; font-size: 15px; color: #9fd2ff; font-style: italic; }

  #inst { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; padding: 0 40px;
    -webkit-align-items: center; align-items: center; border-top: 1px solid rgba(242,237,228,0.13); }
  #inst .host { font-style: italic; font-size: 18px; color: #A9B3C1; margin-right: 18px; }
  #meter { height: 30px; margin-right: 22px; -webkit-align-items: flex-end; align-items: flex-end; }
  #meter i { display: block; width: 4px; margin-right: 2px; background: rgba(242,237,228,0.16); height: 30px; position: relative; }
  #meter i b { position: absolute; left: 0; right: 0; bottom: 0; background: #F2EDE4; }
  .stat { margin-right: 26px; white-space: nowrap; }
  .stat small { font-size: 15px; color: #A9B3C1; margin-right: 6px; }
  .stat .num { font-size: 25px; }
  .warn { color: #F5B04A; } .hot { color: #FF5D4E; }
  #inst .more { font-style: italic; font-size: 17px; color: #A9B3C1; white-space: nowrap; }
  #status { position: absolute; top: 8px; left: 50%; width: 300px; margin-left: -150px; text-align: center;
    font-size: 14px; font-style: italic; color: #FF5D4E; }

  /* ---- workstation detail sheet ---- */
  #sheet, #homeview { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    padding: 30px 40px; background: rgba(6,10,22,0.86); }
  body.v-sheet #sheet, body.v-home #homeview { display: block; }
  #homeview { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body.v-sheet #wrap, body.v-home #wrap { display: none; }
  .head { -webkit-align-items: flex-start; align-items: flex-start; margin-bottom: 22px; }
  .head h1 { margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: 0.5px; }
  .head p { margin: 6px 0 0; font-style: italic; font-size: 18px; color: #A9B3C1; }
  .close { font-size: 19px; padding: 10px 20px; border: 1px solid rgba(242,237,228,0.35); border-radius: 22px; }
  h2 { margin: 0 0 8px; font-weight: 500; font-size: 20px; }
  .col-l { width: 540px; margin-right: 44px; }
  .sec { margin-bottom: 22px; }
  .big { font-size: 54px; line-height: 0.9; margin-right: 14px; }
  .note { font-size: 15px; color: #A9B3C1; font-style: italic; line-height: 1.35; }
  #cores { margin-top: 14px; }
  .core { width: 60px; margin-right: 8px; text-align: center; }
  .core .pair { height: 118px; -webkit-justify-content: center; justify-content: center; }
  .core .th { width: 15px; margin: 0 2px; height: 118px; background: rgba(242,237,228,0.1); position: relative; border-radius: 2px; }
  .core .th b { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 2px; background: #79C2FF;
    -webkit-transition: height 0.8s; transition: height 0.8s; }
  .core .th b.mid { background: #F5B04A; } .core .th b.high { background: #FF5D4E; }
  .core .cn { font-size: 13px; color: #A9B3C1; margin-top: 6px; }
  .core .ghz { font-size: 19px; white-space: nowrap; }
  .stack { height: 12px; border-radius: 6px; overflow: hidden; background: rgba(242,237,228,0.1); margin: 8px 0 6px; }
  .stack b { display: block; height: 100%; float: left; }
  .row { -webkit-align-items: baseline; align-items: baseline; padding: 2px 0; border-bottom: 1px solid rgba(242,237,228,0.07); }
  .row .k { font-size: 17px; }
  .row .k em { color: #A9B3C1; font-size: 14px; }
  .row .v { font-size: 21px; text-align: right; min-width: 70px; white-space: nowrap; }
  .row .v2 { font-size: 21px; text-align: right; min-width: 104px; color: #A9B3C1; white-space: nowrap; }
  .row.hd { border: 0; padding: 0; } .row.hd .v, .row.hd .v2 { font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #A9B3C1; }
  .temps .row .k { font-size: 16px; white-space: nowrap; }
  .temps .row { width: 48%; float: left; margin-right: 2%; } .temps:after { content: ''; display: block; clear: both; }
  .bar { height: 5px; border-radius: 3px; background: rgba(242,237,228,0.12); margin: 4px 0 10px; overflow: hidden; }
  .bar b { display: block; height: 100%; background: #F2EDE4; border-radius: 3px; }

  /* ---- home controls ---- */
  #tiles { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -6px; }
  .tile { width: 224px; margin: 6px; height: 124px; box-sizing: border-box; -webkit-box-sizing: border-box;
    background: rgba(242,237,228,0.07); border: 1px solid rgba(242,237,228,0.08); border-radius: 14px;
    padding: 14px 16px; position: relative; -webkit-transition: background 0.3s; transition: background 0.3s; }
  .tile .nm { font-size: 19px; line-height: 1.2; max-height: 46px; overflow: hidden; padding-right: 18px; }
  .tile .dt { position: absolute; left: 16px; right: 16px; bottom: 12px; font-size: 16px; font-style: italic; color: #A9B3C1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .dot { position: absolute; right: 14px; top: 18px; width: 10px; height: 10px; border-radius: 5px; background: rgba(242,237,228,0.2); }
  .tile.on { background: rgba(245,176,74,0.2); border-color: rgba(245,176,74,0.35); }
  .tile.on .dot { background: #F5B04A; } .tile.on .dt { color: #F5D29A; }
  .tile.d-lock .dot, .tile.d-cover .dot { background: #7FD3A0; }
  .tile.d-lock.on, .tile.d-cover.on { background: rgba(255,131,64,0.2); border-color: rgba(255,131,64,0.4); }
  .tile.d-lock.on .dot, .tile.d-cover.on .dot { background: #FF8340; }
  .tile.d-media_player.on, .tile.d-climate.on { background: rgba(121,194,255,0.16); border-color: rgba(121,194,255,0.3); }
  .tile.d-media_player.on .dot, .tile.d-climate.on .dot { background: #79C2FF; }
  .tile.d-media_player.on .dt, .tile.d-climate.on .dt { color: #bfe0ff; }
  .tile.ro { background: transparent; border-color: rgba(242,237,228,0.12); } .tile.ro .dot { display: none; }
  .tile.ro .dt { font-family: 'Big Shoulders Display', sans-serif; font-style: normal; font-size: 32px; color: #F2EDE4; }
  .tile.alert { background: rgba(255,93,78,0.22); border-color: rgba(255,93,78,0.5); } .tile.alert .dt { color: #ffb3aa; }
  .tile.off-line { opacity: 0.4; }
  .tile.busy { opacity: 0.6; }
  .tile.press { -webkit-transform: scale(0.96); transform: scale(0.96); }
  .tile.climate { width: 460px; }
  .tile .temp { position: absolute; left: 16px; bottom: 34px; font-family: 'Big Shoulders Display', sans-serif; font-size: 48px; }
  .tile .btns { position: absolute; right: 14px; bottom: 14px; display: -webkit-flex; display: flex; }
  .tile .btn { width: 62px; height: 62px; line-height: 58px; text-align: center; font-size: 36px;
    border-radius: 31px; border: 1px solid rgba(242,237,228,0.3); color: #F2EDE4; margin-left: 12px; }
  #toast { position: absolute; left: 50%; bottom: 30px; width: 520px; margin-left: -260px;
    background: rgba(255,93,78,0.92); color: #fff; text-align: center; padding: 12px; border-radius: 22px;
    font-size: 18px; display: none; }
</style>
</head>
<body>
<div id="bg">
  <div id="sky"></div>
  <div class="slide" id="slide0"></div>
  <div class="slide" id="slide1"></div>
  <div id="tint"></div>
  <div id="scrim"></div>
  <canvas id="wx"></canvas>
</div>

<div id="wrap">
  <div id="top" class="flex">
    <div id="date" class="grow shadow"></div>
    <div id="nav" class="flex">
      <div class="link tap" id="go-meadow">Meadow scene</div>
      <div class="link tap" id="go-city">City scene</div>
      <div class="link tap" id="go-home">Home controls</div>
      <div id="units" class="num tap shadow"><span data-u="F">°F</span><span data-u="C">°C</span></div>
    </div>
  </div>
  <div id="lead" class="shadow"><div id="msg"></div><div id="notes"></div></div>

  <div id="clock" class="shadow"><span id="time" class="num">--:--</span><span id="ampm"></span></div>

  <div id="weather" class="shadow">
    <div id="arc"></div>
    <div id="w-now" class="flex"><div id="w-temp" class="num">--</div><div id="w-text" class="grow"></div></div>
    <div id="w-days"></div>
    <div id="w-more"></div>
  </div>

  <div id="inst" class="flex tap">
    <div class="host" id="host">workstation</div>
    <div id="meter" class="flex"></div>
    <div class="stat"><small>CPU</small><span class="num" id="i-cpu">--</span></div>
    <div class="stat"><small>Memory</small><span class="num" id="i-mem">--</span></div>
    <div id="i-disks" class="flex"></div>
    <div class="stat"><small>Chip</small><span class="num" id="i-temp">--</span></div>
    <div class="grow"></div>
    <div class="more">Show breakdown</div>
  </div>
  <div id="status"></div>
</div>

<div id="sheet">
  <div class="head flex">
    <div class="grow"><h1 id="d-host">Workstation</h1><p id="d-sub"></p></div>
    <div class="close tap" id="d-close">Close</div>
  </div>
  <div class="flex">
    <div class="col-l">
      <div class="sec">
        <h2>Processor</h2>
        <div class="flex" style="-webkit-align-items:flex-end;align-items:flex-end">
          <span class="num big" id="d-cpu">--</span>
          <span class="note" id="d-load"></span>
        </div>
        <div id="cores" class="flex"></div>
        <div class="note" style="margin-top:8px">Each core runs two threads, shown as a pair of bars.</div>
      </div>
      <div class="sec">
        <h2>Memory</h2>
        <div class="stack" id="d-memstack"></div>
        <div class="note" id="d-mem"></div>
      </div>
      <div class="sec" id="d-disks"></div>
    </div>
    <div class="grow">
      <div class="sec"><h2>Temperatures</h2><div id="d-temps" class="temps"></div></div>
      <div class="sec" id="d-gpu"></div>
      <div class="sec"><h2>Network</h2><div id="d-net"></div></div>
      <div class="sec"><h2>Busiest programs</h2><div id="d-top"></div></div>
    </div>
  </div>
</div>

<div id="homeview">
  <div class="head flex">
    <div class="grow"><h1>Home</h1><p id="h-sub">Tap a tile to switch it.</p></div>
    <div class="close tap" id="h-close">Back to overview</div>
  </div>
  <div id="tiles"></div>
</div>
<div id="toast"></div>
<script src="extras.js"></script>
<script src="wx.js"></script>
<script src="scene.js"></script>

<script>
(function () {
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var DSHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var night = [23, 7], lastOk = 0, lastState = null, build = null;
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(t) {
    return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function setBodyClass(name, on) {
    var c = (' ' + document.body.className + ' ').replace(' ' + name + ' ', ' ');
    if (on) c += ' ' + name;
    document.body.className = c.replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ');
  }
  function onTap(el, fn) { el.addEventListener('click', fn, false); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* ---------------- units ---------------- */
  var unit = store('unit') || null;   // null until the server tells us the default
  function HW(c) { return c == null ? '--' : Math.round(c) + '°C'; }   // hardware temps: always Celsius
  function T(c) { return c == null ? '--' : Math.round(unit === 'F' ? c * 9 / 5 + 32 : c); }
  function speed(kmh) { return unit === 'F' ? Math.round(kmh * 0.621) + ' mph' : Math.round(kmh) + ' km/h'; }
  function paintUnits() {
    var s = $('units').getElementsByTagName('span');
    for (var i = 0; i < s.length; i++) s[i].className = s[i].getAttribute('data-u') === unit ? 'on' : '';
  }
  onTap($('units'), function () {
    unit = unit === 'F' ? 'C' : 'F'; store('unit', unit); paintUnits();
    if (lastState) render(lastState);
    if (sheetData) renderSheet(sheetData);
  });

  /* ---------------- clock ---------------- */
  function tick() {
    var d = new Date(), h = d.getHours();
    $('time').textContent = (h % 12 || 12) + ':' + pad(d.getMinutes());
    $('ampm').textContent = h < 12 ? 'am' : 'pm';
    $('date').textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
    var isNight = night[0] > night[1] ? (h >= night[0] || h < night[1]) : (h >= night[0] && h < night[1]);
    isNight = isNight || Extras.away();   // dim when nobody's home too
    setBodyClass('night', isNight);
    $('status').textContent = lastOk && Date.now() - lastOk > 30000 ? 'Lost connection to the panel server' : '';
  }

  /* ---------------- weather ---------------- */
  var COMPASS = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'];
  function windPhrase(kmh, dir) {
    if (kmh < 2) return 'calm air';
    var kind = kmh < 12 ? 'a light breeze' : kmh < 29 ? 'a breeze' : kmh < 39 ? 'a fresh wind'
      : kmh < 50 ? 'a strong wind' : kmh < 62 ? 'near-gale winds' : 'gale-force winds';
    var from = dir == null ? '' : ' from the ' + COMPASS[Math.round(dir / 45) % 8];
    return kind + from + ' at ' + speed(kmh);
  }
  function clock12(iso) {
    var p = iso.split('T')[1].split(':'), h = +p[0];
    return (h % 12 || 12) + ':' + p[1] + (h < 12 ? ' am' : ' pm');
  }
  function mins(iso) { var p = iso.split('T')[1].split(':'); return +p[0] * 60 + +p[1]; }

  function drawArc(w) {
    var box = $('arc'), W = 410, cx = W / 2, rx = W / 2 - 52, ry = 40, base = 50, h = '';
    if (!w.sunrise) { box.innerHTML = ''; return; }
    var d = new Date(Date.now() + (w.utc_offset || 0) * 1000);
    var now = d.getUTCHours() * 60 + d.getUTCMinutes(), rise = mins(w.sunrise), set = mins(w.sunset);
    var f = (now - rise) / (set - rise), up = f >= 0 && f <= 1;
    h += '<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '" stroke="rgba(242,237,228,0.25)" stroke-width="1"/>';
    h += '<path d="M' + (cx - rx) + ' ' + base + ' A' + rx + ' ' + ry + ' 0 0 1 ' + (cx + rx) + ' ' + base +
      '" fill="none" stroke="rgba(242,237,228,0.45)" stroke-width="1.2" stroke-dasharray="2 5"/>';
    if (up) {
      var a = Math.PI * (1 - f), x = cx + rx * Math.cos(a), y = base - ry * Math.sin(a);
      h += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="12" fill="rgba(245,176,74,0.25)"/>';
      h += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6" fill="#F5B04A"/>';
    }
    var t = 'font-family="Newsreader, Georgia, serif" font-style="italic" font-size="15" fill="#d9d4ca"';
    h += '<text x="0" y="' + (base + 18) + '" ' + t + '>' + clock12(w.sunrise) + '</text>';
    h += '<text x="' + W + '" y="' + (base + 18) + '" text-anchor="end" ' + t + '>' + clock12(w.sunset) + '</text>';
    if (!up) h += '<text x="' + cx + '" y="' + (base + 2 - ry / 2) + '" text-anchor="middle" ' + t + '>' +
      (f > 1 ? 'Sun has set' : 'Sun not yet up') + '</text>';
    box.innerHTML = '<svg width="' + W + '" height="72" xmlns="http://www.w3.org/2000/svg">' + h + '</svg>';
  }

  function tempColor(c) {   // frost (cold) to amber to ember (hot), on an absolute Celsius scale
    var stops = [[-10, [121, 194, 255]], [10, [168, 214, 230]], [20, [245, 176, 74]], [32, [255, 131, 64]]];
    if (c <= stops[0][0]) return 'rgb(' + stops[0][1].join(',') + ')';
    for (var i = 1; i < stops.length; i++) {
      if (c <= stops[i][0]) {
        var a = stops[i - 1], b = stops[i], k = (c - a[0]) / (b[0] - a[0]);
        return 'rgb(' + Math.round(a[1][0] + (b[1][0] - a[1][0]) * k) + ',' + Math.round(a[1][1] + (b[1][1] - a[1][1]) * k) + ',' + Math.round(a[1][2] + (b[1][2] - a[1][2]) * k) + ')';
      }
    }
    return 'rgb(' + stops[stops.length - 1][1].join(',') + ')';
  }

  function renderWeather(w) {
    if (window.Scene) Scene.setWeather(w);
    if (w.error) {
      $('w-temp').textContent = '';
      $('w-text').textContent = 'Weather is unavailable. ' + w.error + '.';
      $('w-days').innerHTML = ''; $('arc').innerHTML = '';
      return;
    }
    drawArc(w);
    $('w-temp').textContent = T(w.temp) + '°';
    var feels = Math.abs(T(w.feels) - T(w.temp)) >= 3;
    var wind = windPhrase(w.wind, w.wind_dir);
    $('w-text').textContent = w.desc + ' in ' + (w.place || 'town') + '. ' +
      (feels ? 'Feels like ' + T(w.feels) + '°, with ' + wind + '.' : wind.charAt(0).toUpperCase() + wind.slice(1) + '.') +
      ' Humidity ' + w.humidity + '%.';
    var lo = 1e9, hi = -1e9, i, dd;
    for (i = 0; i < w.days.length; i++) { lo = Math.min(lo, w.days[i].lo); hi = Math.max(hi, w.days[i].hi); }
    var span = Math.max(1, hi - lo), html = '';
    for (i = 0; i < w.days.length; i++) {
      dd = w.days[i];
      var p = dd.date.split('-'), name = i === 0 ? 'Today' : DSHORT[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
      var left = (dd.lo - lo) / span * 100, width = Math.max(4, (dd.hi - dd.lo) / span * 100);
      var grad = 'linear-gradient(to right,' + tempColor(dd.lo) + ',' + tempColor(dd.hi) + ')';
      html += '<div class="day flex"><div class="dn">' + name + '</div>' +
        '<div class="lo num">' + T(dd.lo) + '°</div>' +
        '<div class="track grow"><div class="fill" style="left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%;' +
        'background:-webkit-' + grad + ';background:' + grad + '"></div></div>' +
        '<div class="hi num">' + T(dd.hi) + '°</div>' +
        '<div class="rain">' + (dd.rain >= 20 ? esc(dd.rain) + '% rain' : esc(dd.desc === 'Clear' || dd.desc === 'Mostly clear' ? 'Clear' : '')) + '</div></div>';
    }
    $('w-days').innerHTML = html;
  }

  /* ---------------- workstation strip ---------------- */
  function level(p) { return p > 90 ? 'hot' : p > 75 ? 'warn' : ''; }
  var meterBuilt = 0;
  function renderInst(s) {
    var sys = s.system, th = sys.threads || [], i;
    $('host').textContent = s.host;
    if (meterBuilt !== th.length) {
      var m = '';
      for (i = 0; i < th.length; i++) m += '<i><b></b></i>';
      $('meter').innerHTML = m; meterBuilt = th.length;
    }
    var bars = $('meter').getElementsByTagName('b');
    for (i = 0; i < th.length; i++) {
      bars[i].style.height = Math.max(2, Math.min(100, th[i])) + '%';
      bars[i].style.background = th[i] > 90 ? '#FF5D4E' : th[i] > 70 ? '#F5B04A' : '#F2EDE4';
    }
    $('i-cpu').textContent = sys.cpu == null ? '--' : Math.round(sys.cpu) + '%';
    $('i-mem').textContent = Math.round(sys.mem.percent) + '%';
    $('i-mem').className = 'num ' + level(sys.mem.percent);
    var dh = '';
    for (i = 0; i < sys.disks.length; i++) {
      var dk = sys.disks[i];
      dh += '<div class="stat"><small>' + esc(dk.label) + ' disk</small><span class="num ' + level(dk.percent) + '">' + Math.round(dk.percent) + '%</span></div>';
    }
    $('i-disks').innerHTML = dh;
    $('i-temp').textContent = HW(sys.temp_c);
    $('i-temp').className = 'num ' + (sys.temp_c > 90 ? 'hot' : sys.temp_c > 80 ? 'warn' : '');
  }

  /* ---------------- detail sheet ---------------- */
  var sheetData = null, sheetTimer = null;
  function gb(b) { return (b / 1073741824).toFixed(1) + ' GB'; }
  function rate(bps) {
    return bps >= 1048576 ? (bps / 1048576).toFixed(1) + ' MB/s' : bps >= 1024 ? Math.round(bps / 1024) + ' KB/s' : Math.round(bps) + ' B/s';
  }
  function duration(s) {
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? d + (d === 1 ? ' day ' : ' days ') + h + (h === 1 ? ' hour' : ' hours') : h ? h + (h === 1 ? ' hour ' : ' hours ') + m + ' min' : m + ' min';
  }
  function ifName(n) { return /^(en|eth)/.test(n) ? 'Ethernet' : /^(wl|wlan)/.test(n) ? 'Wi-Fi' : /^(tun|wg)/.test(n) ? 'VPN' : n; }

  function renderSheet(d) {
    var i, j, h;
    $('d-host').textContent = lastState ? lastState.host : 'Workstation';
    $('d-sub').textContent = d.model + ', ' + d.cores.length + ' cores and ' + d.threads + ' threads. Up ' + duration(d.uptime_s) + '.';
    $('d-cpu').textContent = d.cpu == null ? '--' : Math.round(d.cpu) + '%';
    $('d-load').innerHTML = 'Load average ' + d.load.join(', ') + '<br>over the last 1, 5 and 15 minutes';
    h = '';
    for (i = 0; i < d.cores.length; i++) {
      var c = d.cores[i], ghz = 0, bars = '';
      for (j = 0; j < c.threads.length; j++) {
        var p = c.threads[j].pct || 0;
        ghz = Math.max(ghz, c.threads[j].ghz || 0);
        bars += '<div class="th"><b class="' + (p > 90 ? 'high' : p > 60 ? 'mid' : '') + '" style="height:' + Math.max(2, Math.min(100, p)) + '%"></b></div>';
      }
      h += '<div class="core"><div class="pair flex">' + bars + '</div><div class="cn">Core ' + (i + 1) + '</div>' +
        '<div class="ghz num">' + (ghz ? ghz.toFixed(1) + ' GHz' : '') + '</div></div>';
    }
    $('cores').innerHTML = h;

    var m = d.mem, t = m.total;
    $('d-memstack').innerHTML = '<b style="width:' + (m.apps / t * 100).toFixed(1) + '%;background:#F2EDE4"></b>' +
      '<b style="width:' + (m.cache / t * 100).toFixed(1) + '%;background:rgba(121,194,255,0.55)"></b>';
    $('d-mem').innerHTML = gb(m.apps) + ' used by programs, ' + gb(m.cache) + ' holding cached files the system can reclaim, ' +
      gb(m.free) + ' completely free. ' + gb(t) + ' in total.' +
      (m.swap_total ? '<br>Swap: ' + gb(m.swap_used) + ' of ' + gb(m.swap_total) + ' in use.' : '');

    h = '<h2>Disks</h2>';
    for (i = 0; i < d.disks.length; i++) {
      var dk = d.disks[i], free = dk.free_gb >= 1000 ? (dk.free_gb / 1000).toFixed(1) + ' TB' : Math.round(dk.free_gb) + ' GB';
      h += '<div class="row flex"><div class="k grow">' + esc(dk.label) + ' <em>' + free + ' free</em></div><div class="v num ' + level(dk.percent) + '">' + Math.round(dk.percent) + '%</div></div>' +
        '<div class="bar"><b style="width:' + Math.min(100, dk.percent) + '%;' + (dk.percent > 90 ? 'background:#FF5D4E' : '') + '"></b></div>';
    }
    $('d-disks').innerHTML = h;

    h = '';
    for (i = 0; i < d.temps.length; i++) {
      var tc = d.temps[i].c;
      h += '<div class="row flex"><div class="k grow">' + esc(d.temps[i].name) + '</div><div class="v num ' +
        (tc > 90 ? 'hot' : tc > 80 ? 'warn' : '') + '">' + HW(tc) + '</div></div>';
    }
    $('d-temps').innerHTML = h || '<div class="note">No temperature sensors found.</div>';

    if (d.gpu) {
      var g = d.gpu;
      $('d-gpu').innerHTML = '<h2>Graphics card</h2><div class="row flex"><div class="k grow">' + esc(g.name) +
        ' <em>' + g.mem_used_gb + ' of ' + g.mem_total_gb + ' GB memory' + (g.watts != null ? ', ' + g.watts + ' W' : '') + '</em></div>' +
        '<div class="v num">' + Math.round(g.util) + '%</div><div class="v num">' + HW(g.c) + '</div></div>';
    } else $('d-gpu').innerHTML = '';

    h = '';
    for (i = 0; i < d.net.length; i++) {
      var n = d.net[i];
      h += '<div class="row flex"><div class="k grow">' + ifName(n.name) + ' <em>' + esc(n.name) + '</em></div>' +
        '<div class="v2 num">↓ ' + rate(n.rx) + '</div><div class="v2 num">↑ ' + rate(n.tx) + '</div></div>';
    }
    $('d-net').innerHTML = h || '<div class="note">Measuring…</div>';

    h = d.top.length ? '<div class="row hd flex"><div class="k grow"></div><div class="v">CPU</div><div class="v2">Memory</div></div>' : '';
    for (i = 0; i < Math.min(4, d.top.length); i++) {
      var pr = d.top[i];
      h += '<div class="row flex"><div class="k grow">' + esc(pr.name) + (pr.count > 1 ? ' <em>' + pr.count + ' processes</em>' : '') + '</div>' +
        '<div class="v num">' + pr.cpu.toFixed(1) + '%</div><div class="v2 num">' + gb(pr.rss) + '</div></div>';
    }
    $('d-top').innerHTML = h || '<div class="note">Measuring…</div>';
  }
  function pollSheet() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/system?t=' + Date.now(), true);
    x.onload = function () { if (x.status === 200) { try { sheetData = JSON.parse(x.responseText); renderSheet(sheetData); } catch (e) {} } };
    x.send();
  }

  /* ---------------- home tiles ---------------- */
  var tiles = {}, busy = {};
  function tileHtml(t) {
    var cls = 'tile d-' + t.domain;
    if (t.on) cls += ' on';
    if (!t.control) cls += ' ro';
    if (t.alert) cls += ' alert';
    if (t.unavailable) cls += ' off-line';
    if (busy[t.id]) cls += ' busy';
    if (t.domain === 'climate') {
      cls += ' climate';
      var tgt = t.target == null ? '--' : t.target + t.unit;
      return '<div class="' + cls + '" data-id="' + esc(t.id) + '" data-act="toggle">' +
        '<div class="dot"></div><div class="nm">' + esc(t.name) + '</div>' +
        '<div class="temp">' + esc(tgt) + '</div>' +
        '<div class="dt">' + esc(t.detail) + (t.current != null ? ', currently ' + esc(t.current + t.unit) : '') + '</div>' +
        '<div class="btns"><div class="btn" data-id="' + esc(t.id) + '" data-act="temp_down">&minus;</div>' +
        '<div class="btn" data-id="' + esc(t.id) + '" data-act="temp_up">+</div></div></div>';
    }
    return '<div class="' + cls + '" data-id="' + esc(t.id) + '"' + (t.control && !t.unavailable ? ' data-act="toggle"' : '') + '>' +
      '<div class="dot"></div><div class="nm">' + esc(t.name) + '</div><div class="dt">' + esc(t.detail) + '</div></div>';
  }
  function renderHome(home) {
    $('go-home').style.display = home ? '' : 'none';
    if (!home) { if (view === 'home') showView('overview'); return; }
    if (home.error) { $('tiles').innerHTML = '<div class="note" style="padding:6px">' + esc(home.error) + '. Check that Home Assistant is running.</div>'; return; }
    var html = '', i;
    tiles = {};
    for (i = 0; i < home.tiles.length; i++) { tiles[home.tiles[i].id] = home.tiles[i]; html += tileHtml(home.tiles[i]); }
    $('tiles').innerHTML = html;
  }
  function currentTiles() {
    var out = [], els = $('tiles').children;
    for (var i = 0; i < els.length; i++) { var id = els[i].getAttribute('data-id'); if (tiles[id]) out.push(tiles[id]); }
    return out;
  }
  function toast(text) {
    var el = $('toast'); el.textContent = text; el.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 4000);
  }
  function findAct(el) {
    while (el && el !== document.body) { if (el.getAttribute && el.getAttribute('data-act')) return el; el = el.parentNode; }
    return null;
  }
  function doAction(id, act) {
    var t = tiles[id];
    if (!t) return;
    if (act === 'toggle' && t.confirm) {
      var verb = t.domain === 'lock' ? 'Unlock ' : (t.on ? 'Close ' : 'Open ');
      if (!window.confirm(verb + t.name + '?')) return;
    }
    busy[id] = true;
    if (act === 'toggle' && t.domain !== 'scene' && t.domain !== 'script') t.on = !t.on;
    renderHome({ tiles: currentTiles() });
    var x = new XMLHttpRequest();
    x.open('POST', '/api/home/action', true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.onloadend = function () {
      delete busy[id];
      if (x.status !== 200) {
        var msg = 'Couldn’t switch ' + t.name;
        try { msg = msg + ': ' + JSON.parse(x.responseText).message; } catch (e) {}
        toast(msg);
      }
      poll();
    };
    x.send(JSON.stringify({ entity_id: id, action: act }));
  }
  onTap($('tiles'), function (e) { var el = findAct(e.target); if (el) doAction(el.getAttribute('data-id'), el.getAttribute('data-act')); });
  $('tiles').addEventListener('touchstart', function (e) {
    var el = findAct(e.target); if (el && el.className.indexOf('tile') === 0) el.className += ' press';
  }, false);
  document.addEventListener('touchend', function () {
    var els = document.querySelectorAll('.press');
    for (var i = 0; i < els.length; i++) els[i].className = els[i].className.replace(' press', '');
  }, false);

  /* ---------------- views + idle return ---------------- */
  var view = 'overview', idleTimer = null;
  var SCENES = { meadow: '/meadow.html', city: '/city.html' };
  function wantScene() { return store('scene') || (lastState && lastState.default_scene) || 'photos'; }
  function showView(name) {
    if (name === 'overview' && SCENES[wantScene()]) { location.replace(SCENES[wantScene()]); return; }
    view = name;
    setBodyClass('v-home', name === 'home');
    setBodyClass('v-sheet', name === 'sheet');
    clearInterval(sheetTimer);
    if (name === 'sheet') { pollSheet(); sheetTimer = setInterval(pollSheet, 2000); }
    if (name === 'home') poll();
    resetIdle();
  }
  function resetIdle() {
    clearTimeout(idleTimer);
    if (view !== 'overview') idleTimer = setTimeout(function () { showView('overview'); }, 120000);
  }
  onTap($('go-home'), function () { showView('home'); });
  onTap($('go-meadow'), function () { store('scene', 'meadow'); location.href = '/meadow.html'; });
  onTap($('go-city'), function () { store('scene', 'city'); location.href = '/city.html'; });
  onTap($('h-close'), function () { showView('overview'); });
  onTap($('inst'), function () { showView('sheet'); });
  onTap($('d-close'), function () { showView('overview'); });
  document.addEventListener('touchstart', resetIdle, false);

  /* ---------------- polling ---------------- */
  function render(s) {
    if (build && s.build && s.build !== build) { location.reload(); return; }  // page files changed
    build = s.build || build;
    if (!store('scene') && SCENES[s.default_scene] && view === 'overview' && !location.hash) { location.replace(SCENES[s.default_scene]); return; }
    lastState = s;
    night = s.night || night;
    if (!unit) { unit = s.default_unit || 'F'; paintUnits(); }
    renderInst(s);
    renderWeather(s.weather);
    renderHome(s.home);
    Extras.render(s);
    var m = $('msg');
    if (s.message && s.message.text) { m.textContent = s.message.text; m.style.display = 'block'; }
    else m.style.display = 'none';
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/state?v=2&t=' + Date.now(), true);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status === 200) { try { render(JSON.parse(x.responseText)); lastOk = Date.now(); } catch (e) { window.onerror(String(e), 'index.html', 0, 0); } }
    };
    x.send();
  }

  // Shift the overview a few pixels every 5 min to avoid LCD image retention.
  var shift = 0;
  function nudge() {
    shift = (shift + 1) % 4;
    var t = 'translate(' + [0, 4, 4, 0][shift] + 'px,' + [0, 0, -4, -4][shift] + 'px)';
    $('wrap').style.webkitTransform = t; $('wrap').style.transform = t;
  }

  Wx.attach($('w-temp'), function () { return unit; });   // tap the temperature for the weather console
  if (unit) paintUnits();
  tick(); poll();
  if (location.hash === '#home') showView('home');
  if (location.hash === '#system') showView('sheet');
  setInterval(tick, 1000);
  setInterval(poll, 5000);
  setInterval(nudge, 300000);
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);  // old Safari leaks over days
})();
</script>
</body>
</html>
